services:
  onsite-prefect-worker:
    image: ${ONSITE_PREFECT_WORKER_IMAGE:-onsite-prefect-worker:latest}
    container_name: ${ONSITE_PREFECT_WORKER_CONTAINER:-onsite-prefect-worker}
    hostname: ${ONSITE_WORKER_HOSTNAME:?Set ONSITE_WORKER_HOSTNAME for this worker host}
    mac_address: ${ONSITE_WORKER_MAC_ADDRESS:?Set ONSITE_WORKER_MAC_ADDRESS for this worker host}
    restart: unless-stopped
    environment:
      PREFECT_API_URL: ${PREFECT_API_URL:-http://bball-130449.nrel.gov:4200/api}
      PREFECT_WORK_POOL: ${PREFECT_WORK_POOL:-julia-pool}
      PREFECT_TASK_WORKER_LIMIT: ${PREFECT_TASK_WORKER_LIMIT:-108}
      PREFECT_TASKS_SCHEDULING_DEFAULT_STORAGE_BLOCK: ${PREFECT_TASKS_SCHEDULING_DEFAULT_STORAGE_BLOCK:-onsite-minio-proxy-storage/onsite-task-scheduling}
      NREL_DEVELOPER_API_KEY: ${NREL_DEVELOPER_API_KEY:-}
      ONSITE_PROJECT_ROOT: /onsite-energy-analysis
    volumes:
      - ${ONSITE_HOST_REPO_PATH:-/home/aswindle/docker/onsite-energy/onsite-energy-analysis}:/onsite-energy-analysis
      - ${ONSITE_HOST_DATA_PATH:-/home/aswindle/docker/onsite-energy/iedo00onsite_data}:/data:ro
      - ${ONSITE_HOST_JULIA_CACHE_PATH:-/home/aswindle/docker/onsite-energy/julia-cache}:/root/.julia